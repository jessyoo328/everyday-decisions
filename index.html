<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Research Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAE6DD; --card:#FFFDF8; --ink:#17202A; --ink2:#3D4752; --muted:#6B7480; --line:#DDD7CB;
  --chip:#F1EDE5; --sel:#1F3A5A; --sel-bg:#EEF2F7; --accent:#C9822E; --err:#A23B2A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
header{height:56px;border-bottom:1px solid var(--line);position:relative}
header .in{max-width:1180px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
header .brand{font-size:12px;letter-spacing:.14em;font-weight:600;color:var(--ink2)}
header .sec{font-size:14px;color:var(--ink2)}
#bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--ink);width:0;transition:width .3s}
main{max-width:1180px;margin:0 auto;padding:40px 24px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 36px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.narrow{max-width:760px;margin:0 auto}
h1{font-size:26px;line-height:1.25;margin:0 0 16px;font-weight:600}
h2{font-size:21px;line-height:1.35;margin:0 0 18px;font-weight:600}
p{margin:0 0 14px;color:var(--ink2)}
.small{font-size:13.5px;color:var(--muted)}
.btnrow{display:flex;justify-content:flex-end;margin-top:26px;gap:12px}
button.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 26px;font:600 15px "IBM Plex Sans",sans-serif;cursor:pointer}
button.primary:disabled{background:#C4C7CB;cursor:not-allowed}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
/* scenario layout */
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
.split.wide{grid-template-columns:minmax(0,.75fr) minmax(0,1.45fr)}
.split.wide .scn p{font-size:14.5px}
.scn .tag{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.scn h2{margin-bottom:14px}
.scn p{color:var(--ink);font-size:15.5px}
.scn .now{background:var(--chip);border-radius:10px;padding:12px 14px;font-weight:500;color:var(--ink);margin-top:6px}
.qhead{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.dots{display:flex;gap:5px;margin-bottom:20px}
.dots span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots span.on{background:var(--ink)}
.q{font-size:19px;font-weight:600;line-height:1.4;margin:0 0 18px}
/* grid */
table.lik{width:100%;border-collapse:collapse;font-size:14.5px}
table.lik th{font-weight:500;font-size:11.5px;color:var(--muted);text-align:center;padding:0 2px 8px;vertical-align:bottom;line-height:1.25}
table.lik td{border-top:1px solid var(--line);padding:9px 2px;text-align:center}
table.lik td.st{text-align:left;padding-right:10px;color:var(--ink);width:50%;font-size:14px}
table.lik input{width:18px;height:18px;accent-color:var(--sel);cursor:pointer}
table.lik tr.miss td.st{color:var(--err)}
/* options */
.opt{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;cursor:pointer;background:#fff;transition:border-color .15s}
.opt:hover{border-color:#B9B2A4}
.opt.on{border-color:var(--sel);background:var(--sel-bg)}
.opt input{display:none}
.opt .lab{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:2px}
.opt .tx{font-size:15px;color:var(--ink)}
.abitem{margin-bottom:18px}
.ablab{font-weight:600;font-size:14.5px;margin:0 0 8px}
.abitem.miss .ablab{color:var(--err)}
.abitem .opt{padding:11px 14px;margin-bottom:8px}
.radio{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;cursor:pointer;background:#fff}
.radio.on{border-color:var(--sel);background:var(--sel-bg)}
.radio input{accent-color:var(--sel);width:18px;height:18px}
/* 1-7 buttons */
.scale{display:flex;gap:8px}
.scale button{flex:1;height:52px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:500 16px "IBM Plex Sans";cursor:pointer;color:var(--ink)}
.scale button.on{border-color:var(--sel);background:var(--sel);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
/* slider */
.slider{position:relative;height:44px;margin:26px 0 4px;cursor:pointer;touch-action:none}
.slider .track{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:#E3DDD0}
.slider .fill{position:absolute;left:0;top:19px;height:6px;border-radius:3px;background:var(--sel)}
.slider .knob{position:absolute;top:10px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--sel);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.slider .val{position:absolute;top:-22px;transform:translateX(-50%);font:600 14px "IBM Plex Mono",monospace;color:var(--sel)}
.hint{font-size:13.5px;color:var(--muted);margin-top:14px}
.err{color:var(--err);font-size:14px;margin-top:12px;min-height:20px}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 6px}
.tile{border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;background:#fff}
.tile h3{margin:0 0 6px;font-size:17px}
.tile p{font-size:14.5px;margin-bottom:8px}
.tile .ex{font-style:italic;color:var(--muted);font-size:14px}
.code{display:inline-block;font:500 24px "IBM Plex Mono",monospace;letter-spacing:.08em;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 18px;margin:4px 0 16px}
input.num, select{font:16px "IBM Plex Sans",system-ui,sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:140px}
select{width:100%;max-width:420px}
label.fl{display:block;font-weight:600;margin:18px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pills .radio{margin:0}
@media (max-width:860px){
  .split,.split.wide{grid-template-columns:1fr}
  .card{padding:24px 20px}
  main{padding:24px 14px 48px}
  .tiles{grid-template-columns:1fr}
  table.lik td.st{width:40%;font-size:13.5px}
  table.lik th{font-size:10px}
}
</style>
</head>

SCENARIOS.forEach(s => Object.assign(s, PATCH[s.id]));
function bodyFor(sc){ return [...sc.pre, ...sc.views.MU, ...sc.post]; }

const ATTN = {k:"attn", t:"To show you are reading, please select “Disagree” in this row.", want:2};
const LIK7 = ["Strongly disagree","Disagree","Somewhat disagree","Neither","Somewhat agree","Agree","Strongly agree"];

const NFC = [ // Need for Closure Scale, 15-item short form (Roets & Van Hiel, 2011), verbatim
 "I don't like situations that are uncertain.",
 "I dislike questions which could be answered in many different ways.",
 "I find that a well-ordered life with regular hours suits my temperament.",
 "I feel uncomfortable when I don't understand the reason why an event occurred in my life.",
 "I feel irritated when one person disagrees with what everyone else in a group believes.",
 "I don't like to go into a situation without knowing what I can expect from it.",
 "When I have made a decision, I feel relieved.",
 "When I am confronted with a problem, I'm dying to reach a solution very quickly.",
 "I would quickly become impatient and irritated if I would not find a solution to a problem immediately.",
 "I don't like to be with people who are capable of unexpected actions.",

 "I find that establishing a consistent routine enables me to enjoy life more.",

];
const LIK6 = ["Strongly disagree","Moderately disagree","Slightly disagree","Slightly agree","Moderately agree","Strongly agree"];

/* ======================= STATE ======================= */
const qs = new URLSearchParams(location.search);
const KEY = "mus2_state_v6";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let S;
try{ S = JSON.parse(sessionStorage.getItem(KEY)||"null"); }catch(e){ S=null; }
if(!S){
  let order = shuffle(SCENARIOS.map(x=>x.id));                      // all five situations, random order
  const forced = qs.get("s"); if(forced && order.includes(forced)) order = [forced, ...order.filter(x=>x!==forced)];   // ?s=<id> puts one first (testing only)
  const per = f=>Object.fromEntries(order.map(id=>[id,f()]));
  S = {
    step:0, started: new Date().toISOString(), t0: Date.now(),
    source: qs.get("PROLIFIC_PID") ? "prolific" : (qs.get("id")||qs.get("sona") ? "sona" : "direct"),
    participant_id: qs.get("PROLIFIC_PID") || qs.get("id") || qs.get("sona") || null,
    study_id: qs.get("STUDY_ID"), session_id: qs.get("SESSION_ID"),
    is_test: qs.get("test")==="1",
    measure_order: "ab_mu_lean", scenario_order: order,
    mu_order: per(()=>shuffle([1,2,3,4,5,6,7])),
    attn_sit: 2, attn_pos: Math.floor(Math.random()*8),         // attention row sits in the MU grid of the 3rd situation
    ab_order: per(()=>shuffle([1,2])),
    ab_left: per(()=>[1,2].map(()=>Math.random()<.5?"E":"A")),
    nfc_order: shuffle(NFC.map((_,i)=>i)),
    answers:{ scenarios:{}, nfc:{}, demo:{}, final:{} },
    timing:{}, events:{resumes:0, blur:0, back:0}
  };
} else { S.events.resumes++; }
function save(){ try{sessionStorage.setItem(KEY, JSON.stringify(S))}catch(e){} }

/* ======================= FLOW ======================= */
const NS = S.scenario_order.length;
const QS = ["ab","mu","lean"];                                   // what they would do first, then MU, then lean
const FLOW = [
  {kind:"consent"}, {kind:"about"},
  ...S.scenario_order.flatMap((sid,pos)=>[{kind:"intro", sid, pos}, ...QS.flatMap((k,i)=> k==="ab" ? [0,1].map(n=>({kind:"q", sid, pos, q:k, qi:i, n})) : [{kind:"q", sid, pos, q:k, qi:i}])]),   // A/B: one choice per screen
  {kind:"nfc"}, {kind:"demo"}, {kind:"final"}, {kind:"debrief"}, {kind:"done"}
];

const app = document.getElementById("app");
const secEl = document.getElementById("sec");
const bar = document.getElementById("bar");
let tScreen = Date.now();

function go(n){
  const cur = FLOW[S.step];
  const key = cur.kind + (cur.sid?("_"+cur.sid):"") + (cur.q?("_"+cur.q):"") + (cur.n!=null?(cur.n+1):"");
  S.timing[key] = (S.timing[key]||0) + (Date.now()-tScreen);
  S.step = n; save(); render(); window.scrollTo(0,0);
}
function next(){ go(S.step+1); }
// Soft prompt: blank answers get one reminder, then the person may continue (the consent letter allows skipping).
let warned=false;
function softGo(complete, msg){ if(complete || warned){ warned=false; save(); next(); return; } warned=true; document.getElementById("err").textContent = msg + " If you prefer not to answer, click the button again to continue."; }

function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  tScreen = Date.now(); warned = false;
  const st = FLOW[S.step];
  bar.style.width = Math.round(100*S.step/(FLOW.length-1))+"%";
  ({consent, about, intro, q:question, nfc, demo, final, debrief, done})[st.kind](st);
}

function ansFor(sid){ return S.answers.scenarios[sid] || (S.answers.scenarios[sid]={position:null}); }

function question(st){
  const sc = SCENARIOS.find(s=>s.id===st.sid);
  const A = ansFor(st.sid); A.position = st.pos+1;
  secEl.textContent="The situation";
  const dots = QS.map((_,i)=>`<span class="${i<=st.qi?"on":""}"></span>`).join("");
  const head = `<div class="qhead">Part ${st.qi+1} of ${QS.length}${st.q==="ab"?` \u00b7 Question ${st.n+1} of 2`:""}</div><div class="dots">${dots}</div>`;
  let inner = "", ok = ()=>true, wide = false;

  if(st.q==="mu"){
    wide = true;
    let rows = S.mu_order[st.sid].map(i=>({k:"mu"+i, t:sc.mu[i-1]}));
    if(st.pos===S.attn_sit) rows.splice(S.attn_pos, 0, ATTN);
    inner = `<div class="q" style="font-size:17px">${esc(sc.mu_lead)}</div>
     <table class="lik"><tr><th></th>${LIK7.map((l,i)=>`<th>${i+1}<br>${l}</th>`).join("")}</tr>
     ${rows.map(r=>`<tr data-k="${r.k}"><td class="st">${esc(r.t)}</td>${LIK7.map((_,i)=>`<td><input type="radio" name="${r.k}" value="${i+1}" aria-label="${LIK7[i]}" ${A[r.k]==i+1?"checked":""}></td>`).join("")}</tr>`).join("")}
     </table>`;
    ok = ()=>{ let all=true; rows.forEach(r=>{ const v=document.querySelector(`input[name="${r.k}"]:checked`); const tr=document.querySelector(`tr[data-k="${r.k}"]`);
               if(!v){all=false;tr.classList.add("miss")} else {tr.classList.remove("miss"); A[r.k]=+v.value;} });
               if(A.attn!=null) A.attn_pass = A.attn===ATTN.want ? 1 : 0;
               return all; };
  }
  if(st.q==="ab"){
    const j = S.ab_order[st.sid][st.n];
    const it = sc.ab[j-1], first = S.ab_left[st.sid][j-1], second = first==="E"?"A":"E", key="ab"+j;
    const o = (code,lab)=>`<label class="opt ${A[key+"_choice"]===code?"on":""}" data-k="${key}" data-c="${code}"><input type="radio" name="${key}" value="${code}"><div class="lab">${lab}</div><div class="tx">${esc(it[code])}</div></label>`;
    inner = `<div class="q" style="font-size:17px">${esc(sc.ab_lead)}</div><div class="abitem" data-k="${key}"><div class="ablab">${esc(it.pre||it.label)}</div>${o(first,"A")}${o(second,"B")}</div>`;
    ok = ()=>{ const el=document.querySelector(`.abitem[data-k="${key}"]`); if(A[key+"_choice"]==null){ el.classList.add("miss"); return false; } el.classList.remove("miss"); return true; };
  }
  if(st.q==="lean"){
    inner = `<div class="q">Overall, does your uncertainty about ${esc(sc.lean_target)} come more from missing information or more from chance?</div>
      <div class="slider" id="sl"><div class="track"></div><div class="fill" style="width:0"></div></div>
      <div class="ends"><span>Entirely missing information</span><span>Entirely chance</span></div>
      <div class="hint">Click or drag along the line to give your answer.</div>`;
    ok = ()=> A.lean!=null;
  }

  app.innerHTML = `<div class="split ${wide?"wide":""}">${scenarioCard(sc, st.pos)}
    <div class="card">${head}${inner}<div class="err" id="err"></div>
    <div class="btnrow"><button class="primary" id="b">Next</button></div></div></div>`;

  if(st.q==="lean") makeSlider(document.getElementById("sl"), A.lean, v=>{A.lean=v; save();}, true);
  if(st.q==="ab") document.querySelectorAll(".opt").forEach(lb=>lb.onclick=()=>{
      const k=lb.dataset.k; document.querySelectorAll(`.opt[data-k="${k}"]`).forEach(x=>x.classList.remove("on")); lb.classList.add("on");
      A[k+"_choice"]=lb.dataset.c; A[k]= lb.dataset.c==="A"?1:0; save(); });

  document.getElementById("b").onclick=()=>{
    softGo(ok(), st.q==="mu" ? "Some rows are not answered yet." : (st.q==="ab" ? "You have not chosen an option yet." : "You have not answered this question yet."));
  };
}

function makeSlider(node, init, cb, noNum){
  const fill=node.querySelector(".fill"); let knob=null, val=null;
  function set(v){ v=Math.max(0,Math.min(100,Math.round(v)));
    if(!knob){ knob=el(`<div class="knob"><div class="val"></div></div>`); node.appendChild(knob); }
    knob.style.left=v+"%"; fill.style.width=v+"%"; knob.querySelector(".val").textContent=noNum?"":v; val=v; cb(v); }
  if(init!=null) set(init);
  function pos(e){ const r=node.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX); return (x-r.left)/r.width*100; }
  let drag=false;
  node.addEventListener("pointerdown",e=>{drag=true; node.setPointerCapture(e.pointerId); set(pos(e));});
  node.addEventListener("pointermove",e=>{ if(drag) set(pos(e)); });
  node.addEventListener("pointerup",()=>drag=false);
}

}

    ${[["yes","Yes, I answered carefully"],["no","No, I did not always answer carefully"]].map(([v,t])=>`<label class="radio ${F.careful===v?"on":""}"><input type="radio" name="careful" value="${v}">${t}</label>`).join("")}
    <label class="fl">Optional: any comments about the study?</label>
    <textarea id="cm" rows="3" style="width:100%;font:15px 'IBM Plex Sans';padding:10px;border:1.5px solid var(--line);border-radius:10px">${esc(F.comments||"")}</textarea>
    <div class="err" id="err"></div><div class="btnrow"><button class="primary" id="b">Continue</button></div></div>`;
  document.querySelectorAll(".radio").forEach(lb=>lb.onclick=()=>{document.querySelectorAll(".radio").forEach(x=>x.classList.remove("on")); lb.classList.add("on"); F.careful=lb.querySelector("input").value; save();});
  document.getElementById("b").onclick=()=>{ F.comments=document.getElementById("cm").value.slice(0,1000); softGo(!!F.careful, "You have not chosen an answer yet."); };
}

function debrief(){
  secEl.textContent="Finish";
  app.innerHTML = `<div class="card narrow"><h1>Thank you</h1>
    <p>This study looks at what people do when they are unsure whether their uncertainty comes from missing information or from chance. For example, someone who thinks a problem has a cause that can be found may look for it, while someone who thinks it is down to chance may set up a backup or spread their risk. We also asked how clearly you could tell which of the two it was.</p>
    <p>The situations you read were made up for this study. There were no right or wrong answers.</p>
    <p class="small">Please click below to save your answers.</p>
    <div class="err" id="err"></div><div class="btnrow"><button class="primary" id="b">Submit and finish</button></div></div>`;
  const b=document.getElementById("b");
  b.onclick=async()=>{ b.disabled=true; b.textContent="Saving…"; const ok = await submit(); if(ok){ next(); } else { b.disabled=false; b.textContent="Try again";
      document.getElementById("err").textContent="We could not save your answers. Please check your connection and try again."; } };
}

function done(){
  secEl.textContent="Finish"; bar.style.width="100%";
  const pro = S.source==="prolific";
  app.innerHTML = `<div class="card narrow"><h1>You're finished</h1>
    <p>Your completion code:</p><div class="code">${CONFIG.COMPLETION_CODE}</div>
    ${pro?`<p>You will be returned to Prolific in a moment. If nothing happens, use the button below.</p><div class="btnrow"><a href="${CONFIG.PROLIFIC_RETURN+CONFIG.COMPLETION_CODE}"><button class="primary">Return to Prolific</button></a></div>`
         :`<p>Your answers have been saved. You can now close this page.</p>`}</div>`;
  if(pro && !S.is_test) setTimeout(()=>location.href=CONFIG.PROLIFIC_RETURN+CONFIG.COMPLETION_CODE, 4000);
}

/* ======================= SAVE ======================= */
async function submit(){
  if(S.submitted) return true;
  const sc = S.answers.scenarios;
  const attn = Object.values(sc).find(a=>a.attn_pass!=null);
  const row = {
    study_version: CONFIG.STUDY_VERSION, source:S.source, participant_id:S.participant_id,
    study_id:S.study_id, session_id:S.session_id, is_test:S.is_test,
    measure_order:S.measure_order, scenario_order:S.scenario_order,
    attention_pass: attn ? attn.attn_pass===1 : null,
    answers: S.answers,
    meta: { started:S.started, total_ms: Date.now()-S.t0, timing:S.timing, events:S.events,
            mu_order:S.mu_order, ab_order:S.ab_order, ab_left:S.ab_left, attn_sit:S.attn_sit, attn_pos:S.attn_pos, nfc_order:S.nfc_order,
            ua:navigator.userAgent, screen:[screen.width,screen.height], viewport:[innerWidth,innerHeight],
            device: /iPad|Tablet/i.test(navigator.userAgent)?"tablet":(/Mobi|Android|iPhone/i.test(navigator.userAgent)?"phone":"desktop") }
  };
  for(let i=0;i<3;i++){
    try{
      const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABLE}`, {method:"POST",
        headers:{"apikey":CONFIG.SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"}, body:JSON.stringify(row)});
      if(r.ok){ S.submitted=true; save(); return true; }
    }catch(e){}
    await new Promise(r=>setTimeout(r, 800*(i+1)));
  }
  return false;
}

/* ======================= GUARDS ======================= */
history.pushState(null,"",location.href);
addEventListener("popstate",()=>{ history.pushState(null,"",location.href); S.events.back++; save(); });
addEventListener("blur",()=>{ S.events.blur++; save(); });
const IS_MOBILE = /iPad|Tablet|Mobi|Android|iPhone/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent) && innerWidth<1100);
if(IS_MOBILE && !S.is_test && S.step===0){
  secEl.textContent="Welcome";
  app.innerHTML = `<div class="card narrow"><h1>Please use a desktop or laptop</h1>
    <p>This study can only be completed on a desktop or laptop computer, and it looks like you are using a phone or tablet.</p>
    <p>${S.source==="prolific" ? "Please <b>return your submission</b> on Prolific. You will not be penalized. You are welcome to start again from a computer." : "Please open this link again from a computer."}</p></div>`;
} else { render(); }
</script>
